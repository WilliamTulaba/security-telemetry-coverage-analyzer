[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "security-telemetry-coverage-analyzer"
version = "1.0.0"
description = "Analyze declared security telemetry coverage and freshness from a CSV inventory."
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "William Tulaba"}]
dependencies = []

[project.scripts]
telemetry-analyzer = "telemetry_analyzer:main"

[tool.setuptools]
py-modules = ["telemetry_analyzer"]
